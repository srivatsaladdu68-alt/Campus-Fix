<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#projBg)" rx="16"/>
  
  <!-- Ceiling & Mount -->
  <line x1="50" y1="30" x2="450" y2="30" stroke="#475569" stroke-width="4"/>
  <rect x="235" y="30" width="30" height="50" fill="#64748b"/>
  <circle cx="250" cy="80" r="12" fill="#475569"/>

  <!-- Projector Body -->
  <rect x="140" y="90" width="220" height="85" rx="14" fill="url(#body)" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Lens Housing -->
  <circle cx="190" cy="132" r="26" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <circle cx="190" cy="132" r="16" fill="#0284c7" opacity="0.6"/>
  <!-- Cooling Vents -->
  <line x1="240" y1="110" x2="330" y2="110" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="120" x2="330" y2="120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="130" x2="330" y2="130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="140" x2="330" y2="140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Damaged HDMI Cable Breakout -->
  <path d="M 340 145 C 380 160, 360 210, 310 210 L 270 210" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Exposed bent pins / spark -->
  <rect x="245" y="202" width="25" height="16" fill="#eab308" rx="2" stroke="#b45309"/>
  <path d="M 240 195 L 230 205 L 245 208 L 235 220" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  
  <!-- "No Signal" Projection Cone (Intermittent blackout) -->
  <polygon points="190,158 90,290 290,290" fill="#38bdf8" opacity="0.12"/>
  <rect x="110" y="240" width="160" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="135" y="265" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">NO HDMI SIGNAL</text>

  <!-- Warning Badge -->
  <rect x="20" y="20" width="240" height="38" rx="8" fill="#ea580c" opacity="0.95"/>
  <text x="32" y="44" fill="white" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">⚡ PROJECTOR PORT FAULT</text>
  <text x="20" y="335" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Location: CSE Building - Classroom 302</text>
</svg>
