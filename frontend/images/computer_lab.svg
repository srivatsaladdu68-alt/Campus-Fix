<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#0f172a" rx="16"/>
  <!-- Desk surface -->
  <line x1="50" y1="260" x2="450" y2="260" stroke="#334155" stroke-width="6"/>

  <!-- PC Monitor -->
  <rect x="150" y="60" width="200" height="130" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <!-- Screen with Blue Screen of Death (BSOD) Error -->
  <rect x="160" y="70" width="180" height="110" rx="4" fill="#0284c7"/>
  <text x="175" y="105" fill="white" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold">:(</text>
  <text x="175" y="130" fill="white" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Your PC ran into a problem</text>
  <text x="175" y="148" fill="#e0f2fe" font-family="Courier New, monospace" font-size="9">HARDWARE_FAILURE_IO</text>

  <!-- Monitor Stand -->
  <rect x="235" y="190" width="30" height="40" fill="#475569"/>
  <ellipse cx="250" cy="235" rx="45" ry="10" fill="#334155"/>

  <!-- Desktop Tower -->
  <rect x="375" y="100" width="65" height="150" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <circle cx="407" cy="125" r="8" fill="#ef4444"/>
  <line x1="390" y1="160" x2="425" y2="160" stroke="#475569" stroke-width="2"/>
  <line x1="390" y1="175" x2="425" y2="175" stroke="#475569" stroke-width="2"/>

  <!-- Keyboard -->
  <rect x="160" y="245" width="150" height="18" rx="3" fill="#334155"/>

  <!-- Warning Badge -->
  <rect x="20" y="20" width="240" height="38" rx="8" fill="#ef4444" opacity="0.95"/>
  <text x="32" y="44" fill="white" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">💻 LAB PC HARDWARE CRASH</text>
  <text x="20" y="335" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Location: CSE Computer Lab 2 - Station 14</text>
</svg>
