<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#0f172a" rx="16"/>
  <!-- Ceiling Tile -->
  <line x1="50" y1="40" x2="450" y2="40" stroke="#334155" stroke-width="4"/>

  <!-- Access Point Router Base -->
  <rect x="190" y="40" width="120" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Antennas -->
  <line x1="210" y1="120" x2="180" y2="200" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="290" y1="120" x2="320" y2="200" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <!-- Status LED flashing RED -->
  <circle cx="250" cy="80" r="7" fill="#ef4444"/>
  <circle cx="250" cy="80" r="14" fill="#ef4444" opacity="0.3"/>

  <!-- Wi-Fi signal arcs with red cross -->
  <path d="M 180 230 A 100 100 0 0 1 320 230" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 205 255 A 60 60 0 0 1 295 255" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="250" cy="275" r="6" fill="#64748b"/>

  <!-- Red Cross Disconnect -->
  <circle cx="250" cy="250" r="28" fill="#ef4444"/>
  <line x1="236" y1="236" x2="264" y2="264" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="264" y1="236" x2="236" y2="264" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Warning Badge -->
  <rect x="20" y="20" width="240" height="38" rx="8" fill="#ea580c" opacity="0.95"/>
  <text x="32" y="44" fill="white" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">📶 WI-FI ACCESS POINT DOWN</text>
  <text x="20" y="335" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Location: Hostel Block A - Corridor Wing 2</text>
</svg>
