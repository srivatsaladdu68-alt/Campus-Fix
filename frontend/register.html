<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Campus Fix</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="nav-logo-icon">
        <i data-lucide="wrench"></i>
      </div>
      <span>Campus Fix</span>
    </a>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline">Already registered? Sign In</a>
    </div>
  </nav>

  <!-- Register Card Container -->
  <div class="auth-wrapper">
    <!-- Centered Header Above Card -->
    <div class="auth-page-header">
      <div class="auth-badge-icon">
        <i data-lucide="user-plus" style="width: 26px; height: 26px;"></i>
      </div>
      <h1>Create an Account</h1>
      <p>Report and track campus maintenance requests seamlessly.</p>
    </div>

    <!-- Centered Form Card -->
    <div class="auth-card" style="max-width: 540px;">
      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <div class="form-control-wrap">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="full_name" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Campus Email Address *</label>
          <div class="form-control-wrap">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="student@vnrvjiet.in" required autocomplete="email">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <div class="form-control-wrap">
              <i data-lucide="phone" class="input-icon"></i>
              <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" autocomplete="tel">
            </div>
          </div>

          <div class="form-group">
            <label for="role">Campus Role *</label>
            <div class="form-control-wrap">
              <i data-lucide="award" class="input-icon"></i>
              <select id="role" class="form-control" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty / Instructor</option>
              </select>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="password">Password *</label>
            <div class="form-control-wrap">
              <i data-lucide="lock" class="input-icon"></i>
              <input type="password" id="password" class="form-control" placeholder="At least 6 chars" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password *</label>
            <div class="form-control-wrap">
              <i data-lucide="shield-check" class="input-icon"></i>
              <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
            </div>
          </div>
        </div>

        <div style="font-size: 0.8rem; color: var(--cream-muted); margin-bottom: 1.25rem; background: rgba(255,255,255,0.03); padding: 0.6rem 0.85rem; border-radius: 8px; border: 1px dashed rgba(244,239,230,0.12);">
          ℹ️ <strong>Note:</strong> Maintenance Staff and Administrator accounts are provisioned directly by the Campus Facilities Admin.
        </div>

        <button type="submit" class="btn-auth-submit" id="register-btn">
          <i data-lucide="check" style="width: 18px; height: 18px;"></i>
          Register Account
        </button>
      </form>

      <!-- Switch to Login Bar -->
      <div class="auth-switch-bar">
        <span>Already have an account?</span>
        <a href="login.html" class="btn-auth-switch">
          <i data-lucide="log-in" style="width: 14px; height: 14px;"></i>
          Sign In
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();
    Auth.redirectIfLoggedIn();

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('register-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;

      if (!full_name || !email || !password) {
        API.showToast('Please fill in all required fields.', 'error');
        return;
      }

      if (password.length < 6) {
        API.showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      if (password !== confirm_password) {
        API.showToast('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Registering...';

      const res = await API.call('/auth/register', 'POST', {
        full_name,
        email,
        phone,
        role,
        password
      });

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="check" style="width: 18px; height: 18px;"></i> Register Account';
      lucide.createIcons();

      if (res && res.success) {
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        API.showToast('Account registered successfully! Welcome.', 'success');
        setTimeout(() => {
          window.location.href = Auth.getDashboardUrl(res.user.role);
        }, 600);
      } else {
        API.showToast(res.message || 'Registration failed.', 'error');
      }
    });
  </script>
</body>
</html>
