<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Campus Fix</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="nav-logo-icon">
        <i data-lucide="wrench"></i>
      </div>
      <span>Campus Fix</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-outline">Back to Home</a>
    </div>
  </nav>

  <!-- Login Card Container -->
  <div class="auth-wrapper">
    <!-- Centered Header Above Card (Matches Sample Design) -->
    <div class="auth-page-header">
      <div class="auth-badge-icon">
        <i data-lucide="shield-check" style="width: 26px; height: 26px;"></i>
      </div>
      <h1>Sign In</h1>
      <p>Access your campus maintenance dashboard and track repairs.</p>
    </div>

    <!-- Centered Form Card -->
    <div class="auth-card">
      <form id="login-form">
        <div class="form-group">
          <label for="email">Campus Email</label>
          <div class="form-control-wrap">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="student@vnrvjiet.in" required autofocus autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-control-wrap">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password-btn" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Show/Hide password">
              <i data-lucide="eye" id="toggle-pwd-icon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="login-btn">
          <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
          Sign In
        </button>
      </form>

      <!-- Switch to Register Bar -->
      <div class="auth-switch-bar">
        <span>Don't have an account?</span>
        <a href="register.html" class="btn-auth-switch">
          <i data-lucide="user-plus" style="width: 14px; height: 14px;"></i>
          Register
        </a>
      </div>

      <!-- Quick 1-Click Demo Accounts Switcher -->
      <div class="demo-accounts-box">
        <div class="demo-accounts-header">
          <i data-lucide="zap" style="width: 14px; height: 14px; color: var(--cream-gold);"></i>
          <span>1-Click Demo Logins</span>
        </div>
        <div class="demo-chips-grid">
          <button type="button" class="demo-role-chip" onclick="fillCreds('admin@vnrvjiet.in', 'Admin@123')">
            <span class="role-tag-pill admin">Admin</span> Administrator
          </button>
          <button type="button" class="demo-role-chip" onclick="fillCreds('staff.mike@vnrvjiet.in', 'Staff@123')">
            <span class="role-tag-pill staff">Staff</span> Electrician (Mike)
          </button>
          <button type="button" class="demo-role-chip" onclick="fillCreds('staff.sarah@vnrvjiet.in', 'Staff@123')">
            <span class="role-tag-pill staff">Staff</span> Plumber (Sarah)
          </button>
          <button type="button" class="demo-role-chip" onclick="fillCreds('student.alex@vnrvjiet.in', 'Student@123')">
            <span class="role-tag-pill student">Student</span> Alex Morgan
          </button>
          <button type="button" class="demo-role-chip" onclick="fillCreds('prof.sharma@vnrvjiet.in', 'Faculty@123')">
            <span class="role-tag-pill faculty">Faculty</span> Prof. Sharma
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();
    Auth.redirectIfLoggedIn();

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const icon = document.getElementById('toggle-pwd-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Check for query parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      API.showToast('Your session has expired. Please sign in again.', 'warning');
    }
    if (urlParams.get('pending')) {
      API.showToast('Registration received! Staff accounts require admin approval before sign-in.', 'info');
    }

    function fillCreds(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      API.showToast(`Selected demo credentials for ${email}`, 'info');
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        API.showToast('Please enter both email and password.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';

      const res = await API.call('/auth/login', 'POST', { email, password });
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Sign In';
      lucide.createIcons();

      if (res && res.success) {
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        API.showToast(`Welcome back, ${res.user.full_name}!`, 'success');

        const redirect = urlParams.get('redirect') || Auth.getDashboardUrl(res.user.role);
        setTimeout(() => {
          window.location.href = redirect;
        }, 500);
      } else {
        if (res && res.code === 'USER_NOT_FOUND') {
          API.showToast("No account found for this email! Click 'Register' below to create one.", 'warning');
          const regBtn = document.querySelector('.btn-auth-switch');
          if (regBtn) {
            regBtn.style.borderColor = 'var(--cream-gold)';
            regBtn.style.boxShadow = '0 0 18px rgba(251, 215, 132, 0.45)';
          }
        } else if (res && res.code === 'PENDING_APPROVAL') {
          API.showToast('Your account is currently pending administrator verification. Please await approval.', 'warning');
        } else if (res && res.code === 'ACCOUNT_REJECTED') {
          API.showToast('Your registration request was not approved by the administrator.', 'error');
        } else {
          API.showToast(res && res.message ? res.message : 'Invalid email or password.', 'error');
        }
      }
    });
  </script>
</body>
</html>
