<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Campus Fix</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="nav-logo-icon">
        <i data-lucide="wrench"></i>
      </div>
      <span>Campus Fix</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-outline">Back to Home</a>
    </div>
  </nav>

  <!-- Login Card Container -->
  <div class="auth-wrapper">
    <!-- Centered Header Above Card (Matches Sample Design) -->
    <div class="auth-page-header">
      <div class="auth-badge-icon">
        <i data-lucide="shield-check" style="width: 26px; height: 26px;"></i>
      </div>
      <h1>Sign In</h1>
      <p>Access your campus maintenance dashboard and track repairs.</p>
    </div>

    <!-- Centered Form Card -->
    <div class="auth-card">
      <div id="login-alert" style="display: none; padding: 0.8rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.86rem; background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; line-height: 1.4;"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Campus Email Address</label>
          <div class="form-control-wrap">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="yourname@vnrvjiet.in" required autofocus autocomplete="email">
          </div>
          <small style="display: block; margin-top: 0.35rem; font-size: 0.74rem; color: var(--cream-muted);">
            Unified portal for Students, Faculty, Maintenance Staff, and Administrators.
          </small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-control-wrap">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password-btn" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Show/Hide password">
              <i data-lucide="eye" id="toggle-pwd-icon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="login-btn">
          <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
          Sign In
        </button>
      </form>

      <!-- Switch to Register Bar -->
      <div class="auth-switch-bar">
        <span>New to Campus Fix?</span>
        <a href="register.html" class="btn-auth-switch">
          <i data-lucide="user-plus" style="width: 14px; height: 14px;"></i>
          Register Account
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();
    Auth.redirectIfLoggedIn();

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const icon = document.getElementById('toggle-pwd-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Check for query parameters without toast popups
    const urlParams = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('login-alert');
    if (urlParams.get('expired') && alertBox) {
      alertBox.textContent = 'Your session has expired. Please sign in again.';
      alertBox.style.display = 'block';
    } else if (urlParams.get('pending') && alertBox) {
      alertBox.textContent = 'Registration received! Your account is pending administrator review.';
      alertBox.style.background = 'rgba(251, 215, 132, 0.14)';
      alertBox.style.borderColor = 'rgba(251, 215, 132, 0.35)';
      alertBox.style.color = 'var(--cream-gold)';
      alertBox.style.display = 'block';
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (alertBox) alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        if (alertBox) {
          alertBox.textContent = 'Please enter both email and password.';
          alertBox.style.display = 'block';
        }
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';

      const res = await API.call('/auth/login', 'POST', { email, password });
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Sign In';
      lucide.createIcons();

      if (res && res.success) {
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        // Direct seamless redirection without toast popup delays
        const redirect = urlParams.get('redirect') || Auth.getDashboardUrl(res.user.role);
        window.location.href = redirect;
      } else {
        if (alertBox) {
          let msg = res && res.message ? res.message : 'Invalid email or password.';
          if (res && res.code === 'USER_NOT_FOUND') {
            msg = "No account found for this email. Click 'Register Account' below to sign up.";
            const regBtn = document.querySelector('.btn-auth-switch');
            if (regBtn) {
              regBtn.style.borderColor = 'var(--cream-gold)';
              regBtn.style.boxShadow = '0 0 18px rgba(251, 215, 132, 0.45)';
            }
          } else if (res && res.code === 'PENDING_APPROVAL') {
            msg = 'Your account is currently pending administrator verification. Please await approval.';
          } else if (res && res.code === 'ACCOUNT_REJECTED') {
            msg = 'Your registration request was not approved by the administrator.';
          }
          alertBox.textContent = msg;
          alertBox.style.background = 'rgba(239, 68, 68, 0.14)';
          alertBox.style.borderColor = 'rgba(239, 68, 68, 0.35)';
          alertBox.style.color = '#fca5a5';
          alertBox.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
