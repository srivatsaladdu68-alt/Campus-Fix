<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#bg)" rx="16"/>
  <!-- Grid floor -->
  <line x1="50" y1="280" x2="450" y2="280" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="310" x2="420" y2="310" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Chair Backrest (tilted) -->
  <g transform="rotate(18 250 160)">
    <rect x="220" y="60" width="60" height="90" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="235" y1="75" x2="265" y2="75" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="235" y1="95" x2="265" y2="95" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="235" y1="115" x2="265" y2="115" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Seat -->
    <rect x="200" y="150" width="100" height="22" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
  </g>

  <!-- Damaged Hydraulic Cylinder -->
  <rect x="242" y="180" width="16" height="55" fill="url(#metal)" rx="3"/>
  <!-- Crack / Snap marker -->
  <path d="M 240 205 L 250 208 L 243 213 L 260 216" stroke="#ef4444" stroke-width="3" fill="none"/>
  
  <!-- Broken base caster wheels -->
  <path d="M 250 235 L 180 270 M 250 235 L 320 270 M 250 235 L 250 275" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
  <!-- Missing wheel on left -->
  <circle cx="180" cy="270" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="320" cy="275" r="9" fill="#475569"/>
  <circle cx="250" cy="280" r="9" fill="#475569"/>

  <!-- Warning Badge -->
  <rect x="20" y="20" width="220" height="38" rx="8" fill="#ef4444" opacity="0.95"/>
  <text x="32" y="44" fill="white" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">⚠️ DAMAGED CHAIR BASE</text>
  <text x="20" y="325" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Location: Central Library - Quiet Bay C</text>
</svg>
